experiment_name: agent_design_mitigation_study
base_dataset_name: source_only_attack_benchmark
purpose: >-
  Evaluate prompt/input-level interventions on a plausible synthetic GEO stress setting.
  The experiment uses 600 base cases, all three target slots, and eight plausible
  synthetic GEO archetypes. No no-attack controls are used in this mitigation stress test;
  each layer is compared against L0 on the same attacked instances.

target_selection:
  target_slots: [A, B, C]
  rationale: >-
    All three fixed non-ground-truth target slots are retained so that the L0
    condition is exactly the main benchmark attack set and mitigation effects are
    not tied to one target role.

packages:
  package_family: realistic  # retained as the stable dataset identifier
  include:
    - caveat_burial_faq
    - popularity_heavy_profile
    - citation_padded_note
    - independent_buyer_guide
    - false_fit_checklist
    - selective_comparison_note
    - ai-directed_source_text
    - full_stack_realistic_geo
  exclude_controls: true

layers:
  - L0_source_only_baseline
  - L1_prompt_mitigation
  - L2_rationale_elicitation_mitigation
  - L3_evidence_breakdown_mitigation
  - L4_context_balancing_mitigation
  - L5_instruction_filtering_mitigation

run_sizes:
  final:
    base_cases: 600
    packages_per_case: 8
    target_slots: 3
    instances_per_layer: 14400
  screening:
    base_cases: 150
    packages_per_case: 8
    target_slots: 3
    instances_per_layer: 3600

metrics:
  attack_outcomes:
    - attacked_target_top1_rate
    - attacked_target_top3_rate
    - mean_attacked_target_rank
    - hard_constraint_violation_at_1
    - misleading_geo_line_citation_rate
    - geo_doc_citation_rate
  recommendation_quality:
    - top3_acceptable_gt_recall
    - utility_ndcg_at_5
    - regret_at_1
    - parse_failure_rate
  reduction_vs_L0:
    - target_top3_reduction
    - hard_violation_reduction
    - misleading_citation_reduction
    - mean_rank_improvement_against_attack
