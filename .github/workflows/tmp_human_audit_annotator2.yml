name: Temporary Annotator 2 human-audit material extraction

on:
  push:
    branches:
      - tmp-human-audit-annotator2-20260712
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install extractor dependency
        run: python -m pip install --disable-pip-version-check pyarrow

      - name: Materialize the fixed audit sample
        run: python tools/tmp_extract_human_audit_annotator2.py

      - name: Show extraction status
        run: cat tmp_human_audit_annotator2/status.json

      - name: Commit extracted case packets to the temporary branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp_human_audit_annotator2
          if git diff --cached --quiet; then
            echo "No material changes to commit."
          else
            git commit -m "Materialize temporary Annotator 2 human-audit inputs"
            git push
          fi

      - name: Upload extracted packets
        uses: actions/upload-artifact@v4
        with:
          name: safegeo-human-audit-annotator2
          path: tmp_human_audit_annotator2
          retention-days: 1
