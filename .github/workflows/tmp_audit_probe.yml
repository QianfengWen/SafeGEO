name: Temporary SafeGEO audit probe

on:
  push:
    branches:
      - tmp-human-audit-package-20260711

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-human-audit-package-20260711
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Build probe
        run: python tools/tmp_audit_probe.py
      - name: Commit probe output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tmp_probe_output/schema_and_samples.json
          git commit -m "Add temporary audit schema probe output [skip ci]" || exit 0
          git push origin HEAD:tmp-human-audit-package-20260711
