name: Temporary SafeGEO audit probe

on:
  push:
    branches:
      - tmp-human-audit-package-20260711
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Build probe
        run: python tools/tmp_audit_probe.py
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: safegeo-audit-probe
          path: tmp_audit_probe/
          retention-days: 1
