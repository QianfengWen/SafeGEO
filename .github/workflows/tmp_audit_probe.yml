name: Temporary SafeGEO full-data export

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package public dataset and loader
        run: tar -czf safegeo_full_data.tar.gz data src/safegeo
      - name: Upload full data
        uses: actions/upload-artifact@v4
        with:
          name: safegeo-full-data
          path: safegeo_full_data.tar.gz
          retention-days: 1
