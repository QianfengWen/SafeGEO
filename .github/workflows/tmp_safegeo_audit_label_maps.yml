name: Temporary SafeGEO audit label-map extraction

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pyarrow
      - run: python tmp/extract_safegeo_audit_label_maps.py
      - uses: actions/upload-artifact@v4
        with:
          name: safegeo-audit-selected-labels
          path: safegeo_audit_selected_labels.json.gz
          if-no-files-found: error
          retention-days: 1
