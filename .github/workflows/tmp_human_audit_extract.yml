name: Temporary human-audit material extraction

on:
  push:
    branches:
      - tmp-human-audit-annotator1-20260711

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: tmp-human-audit-annotator1-20260711
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet pyarrow
      - run: python tools/tmp_extract_human_audit.py
      - name: Commit extracted materials
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp_human_audit_materials
          git commit -m "Materialize temporary human-audit inputs" || exit 0
          git push origin HEAD:tmp-human-audit-annotator1-20260711
